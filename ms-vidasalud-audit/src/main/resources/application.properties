spring.application.name=audit
server.port=8081

# Base de Datos Oracle XE
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:oracle-db}:1521/XE
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASS:oracle}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# RabbitMQ (se mantiene intacto)
spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.acknowledge-mode=manual
messaging.queue.audit=q.audit

# Apache Kafka (Consumidores y Productor)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.consumer.group-id=audit-citas-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

vidasalud.kafka.topic.citas=vidasalud.citas.eventos
vidasalud.kafka.topic.auditoria=vidasalud.auditoria.stream
